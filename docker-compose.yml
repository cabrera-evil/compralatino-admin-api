# Standalone admin-api; run with `--env-file ../compralatino-infra/.env` so shared credentials match compralatino-infra (`docker compose --profile infra up -d` there).
services:
  admin-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: compralatino-admin-api
    container_name: compralatino_admin_api
    restart: unless-stopped
    networks:
      - compralatino_net
    env_file:
      - .env
    environment:
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CACHE_ENABLED: 'true'
      CACHE_STORE: redis
      QUEUE_ENABLED: 'true'
      THROTTLE_STORAGE: redis
      THROTTLE_TRUST_PROXY: 'true'
      RABBITMQ_ENABLED: 'true'
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-compralatino}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RABBITMQ_EXCHANGE: compralatino_events
      DATABASE_URL: postgresql://${POSTGRES_USER:-compralatino}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-compralatino}?schema=admin_svc
      RABBITMQ_QUEUE: admin_svc_queue
    ports:
      - '3005:3000'
    labels:
      - traefik.enable=true
      - traefik.http.routers.admin-api.rule=(Host(`api.localhost`) || Host(`traefik`)) && PathPrefix(`/admin/`)
      - traefik.http.routers.admin-api.entrypoints=web
      - traefik.http.routers.admin-api.middlewares=admin-api-strip
      - traefik.http.middlewares.admin-api-strip.stripprefix.prefixes=/admin
      - traefik.http.services.admin-api.loadbalancer.server.port=3000
      - traefik.http.routers.admin-api-v1.rule=(Host(`api.localhost`) || Host(`traefik`)) && PathPrefix(`/api/v1/admin`)
      - traefik.http.routers.admin-api-v1.entrypoints=web
      - traefik.http.routers.admin-api-v1.service=admin-api

networks:
  compralatino_net:
    external: true
    name: compralatino_net
